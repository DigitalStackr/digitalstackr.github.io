<!--
  ATTRIBUTION TEST v2 — isolated, nothing links here.

  WHY v1 WAS INVALID
    v1 carried a <meta http-equiv="refresh"> fallback. Meta-refresh navigations
    commonly send NO referrer at all, which matches exactly what Gumroad
    recorded ("direct" — not even a bare origin). The fallback I added to be
    safe is the most likely thing that broke the measurement.

  WHAT CHANGED
    * meta refresh REMOVED entirely
    * navigation is now a real anchor the user taps — anchor clicks are the
      most reliable referrer-carrying navigation there is
    * no JS auto-redirect either, so nothing races the click

    Slower for a human, but this run is about measuring the referrer, not
    about being seamless. If an anchor click cannot carry the path, nothing
    will, and we will know the answer is final.
-->
<meta name="referrer" content="unsafe-url">
<title>Attribution test</title>
