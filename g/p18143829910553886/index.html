<!doctype html>

<meta charset="utf-8">
<!--
  ATTRIBUTION TEST PAGE — Phase 1 only. Not wired into any CTA, post or link.
  Reachable only by typing the URL directly.

  WHAT THIS IS TESTING
    Threads and Beacons send only the bare origin as HTTP referrer
    ("https://l.threads.com/"), so a tracking parameter placed on a Gumroad
    link is discarded before Gumroad ever sees it. Verified against 522 real
    orders.

    A page on a domain WE control can override that. `referrer=unsafe-url`
    asks the browser to send this page's FULL url — path included — to the
    next destination. If Gumroad records
        https://digitalstackr.com/g/p18143829910553886
    in the sale's `referrer` field, then the Threads post id survives the hop
    and post-level attribution is achievable.

  WHY A FREE PRODUCT
    381 of 457 free downloads on this account already carry a real referrer,
    so a $0 order proves the mechanism exactly as well as a paid one — with no
    fee, no refund, and no chance of Gumroad blocking a self-purchase.
-->
<meta name="referrer" content="unsafe-url">
<title>Redirecting…</title>
<!-- Fallback for browsers that block scripted navigation. Fires after JS. -->
<meta http-equiv="refresh" content="2;url=https://digitalstackr.gumroad.com/l/kfkrgp">

     border-top-color:#C9A961;border-radius:50%;animation:s .8s linear infinite}

  @media (prefers-reduced-motion:reduce){.d{animation:none;border-top-color:#C9A961}}
  a{color:#C9A961}

</style>
